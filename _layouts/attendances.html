---
layout: page
---
<div class="attendances">
  {{ content }}

{% assign attendances = site.data.attendances | sort: 'date' | reverse %}
{% for item in attendances %}
<details markdown="1">
<summary>
  {{ item.title }}
  <br>
  <span class="badge font-weight-bold date-badge text-uppercase align-middle" style="min-width: 75px; margin-right: 10px;">
      {{ item.date | date: "%B %Y" }}
  </span> 
  {% if item.location %}
    <span class="badge font-weight-normal location-badge text-uppercase align-middle"><i class="ti ti-map-pin"></i> {{ item.location }}</span>
  {% endif %}
</summary>

{{ item.description }}

  </details>

  {% endfor %}
</div>
