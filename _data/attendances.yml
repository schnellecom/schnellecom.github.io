  description: "<a href='https://cirp-design2026.jspe.or.jp/' target='_blank'>cirp-design2026.jspe.or.jp</a><br>Presented two <em>Procedia CIRP</em> papers: a probabilistic study quantifying how geometric variance impacts the performance of formed airbag pressure bins (<a href='/projects/sfb-trr-188/'>TRR 188</a>, A09) and a numerical parameter study on how a generative design parameter influences the mechanical performance of hexagonal topological interlocking assemblies (<a href='/projects/sfb-trr-280/'>SFB/TRR 280</a>, A04)."
